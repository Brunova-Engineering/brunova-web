server {
    listen 80;
    listen [::]:80;
    server_name brunova.mx www.brunova.mx;
    return 301 https://brunova.mx$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name brunova.mx;

    ssl_certificate /etc/letsencrypt/live/brunova.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunova.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.brunova.mx;

    ssl_certificate /etc/letsencrypt/live/brunova.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brunova.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://brunova.mx$request_uri;
}
