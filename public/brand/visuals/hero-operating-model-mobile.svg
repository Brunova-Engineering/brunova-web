<svg xmlns="http://www.w3.org/2000/svg" width="390" height="720" viewBox="0 0 390 720" role="img" aria-labelledby="title desc">
  <!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
  <title id="title">From fragmented operation to reliable operation</title>
  <desc id="desc">Work, data and systems converge into a governed operating model defined by state, decisions and ownership, producing controlled, operable and scalable outcomes.</desc>
  <defs>
    <style>
      :root { color-scheme:light dark; --ink:#F2EFE9; --muted:#A9AAA5; --faint:#575B59; --rule:#3D4341; --boundary:#7E827E; --surface:#151816; --accent:#D8C5A6; --highlight:#F4E8D3; }
      @media (prefers-color-scheme:light) { :root { --ink:#1C1D1B; --muted:#666762; --faint:#A6A59E; --rule:#C8C5BC; --boundary:#77766F; --surface:#F0ECE4; --accent:#8C7655; --highlight:#5F4D35; } }
      .display{font-family:Manrope,Arial,sans-serif}.body{font-family:"IBM Plex Sans",Arial,sans-serif}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.rule{stroke:var(--rule)}
    </style>
    <linearGradient id="flow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="var(--faint)" stop-opacity=".35"/><stop offset=".62" stop-color="var(--accent)" stop-opacity=".78"/><stop offset="1" stop-color="var(--highlight)"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--highlight)" stop-opacity=".72"/><stop offset=".58" stop-color="var(--accent)" stop-opacity=".32"/><stop offset="1" stop-color="var(--faint)" stop-opacity=".08"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l8 4-8 4z" fill="var(--accent)"/></marker>
  </defs>
  <g class="body">
    <text x="20" y="28" class="muted" font-size="11" font-weight="600" letter-spacing="1.35">FRAGMENTED OPERATION</text>
    <path d="M20 40H370" class="rule" fill="none"/>
    <g class="ink" font-size="13" font-weight="500" text-anchor="middle"><text x="62" y="78">Work</text><text x="195" y="78">Data</text><text x="328" y="78">Systems</text></g>
    <g fill="none" stroke="var(--faint)" stroke-linecap="round"><path d="M30 92H94"/><path d="M163 92H227"/><path d="M296 92H360"/></g>
    <g fill="var(--ink)"><circle cx="62" cy="92" r="3"/><circle cx="195" cy="92" r="3"/><circle cx="328" cy="92" r="3"/></g>
    <g fill="none" stroke="url(#flow)" stroke-linecap="round"><path d="M62 102C62 144 150 136 195 176" stroke-width="2"/><path d="M195 102V176" stroke-width="1.7"/><path d="M328 102C328 144 240 136 195 176" stroke-width="2"/></g>
    <path d="M187 180l8-8 8 8-8 8z" fill="var(--highlight)"/><circle cx="195" cy="180" r="2" fill="var(--surface)"/>

    <text x="20" y="216" class="muted" font-size="11" font-weight="600" letter-spacing="1.35">DEFINED BOUNDARY</text>
    <path d="M20 228H370" class="rule" fill="none"/>
    <path d="M38 248H352L366 262V500L352 514H38L24 500V262Z" fill="var(--surface)" fill-opacity=".34" stroke="var(--boundary)" stroke-width="1.3"/>
    <path d="M34 278V258H54M336 258H356V278M356 484V504H336M54 504H34V484" fill="none" stroke="var(--accent)" stroke-opacity=".5"/>
    <text x="195" y="286" text-anchor="middle" class="display ink" font-size="20" font-weight="600">Operating model</text>
    <g transform="translate(195 365)" fill="none" stroke="var(--boundary)" stroke-opacity=".48"><path d="M0-50l92 27L0 4l-92-27z"/><path d="M0-25l92 27L0 29-92 2z"/><path d="M0 0l92 27L0 54-92 27z"/><path d="M0 25l92 27L0 79-92 52z"/></g>
    <path d="M195 323l92 27-92 27-92-27z" fill="url(#plate)" stroke="var(--accent)" stroke-opacity=".58"/>
    <path d="M195 307V454" stroke="var(--boundary)" stroke-opacity=".38" stroke-dasharray="2 5"/><circle cx="195" cy="350" r="4" fill="var(--highlight)"/><circle cx="195" cy="417" r="2.5" fill="var(--accent)"/>
    <g class="ink" font-size="12" font-weight="500" text-anchor="middle"><text x="82" y="480">State</text><text x="195" y="480">Decisions</text><text x="308" y="480">Ownership</text></g>

    <path d="M195 514V552" stroke="var(--accent)" stroke-width="1.5"/>
    <path d="M187 554l8-8 8 8-8 8z" fill="var(--highlight)"/><circle cx="195" cy="554" r="2" fill="var(--surface)"/>
    <text x="20" y="594" class="muted" font-size="11" font-weight="600" letter-spacing="1.35">RELIABLE OPERATION</text>
    <path d="M20 606H370" class="rule" fill="none"/>
    <g fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"><path d="M195 565C170 610 88 620 72 651"/><path d="M195 565V651" opacity=".72"/><path d="M195 565C220 610 302 620 318 651" opacity=".84"/></g>
    <g class="ink" font-size="12" font-weight="500" text-anchor="middle"><text x="72" y="686">Controlled</text><text x="195" y="686">Operable</text><text x="318" y="686">Scalable</text></g>
  </g>
</svg>
