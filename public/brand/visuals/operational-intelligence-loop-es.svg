      <text x="48" y="-3" fill="#F4F3EF" font-size="20" font-weight="600">Observar</text>
      <text x="48" y="18" fill="#AAB1AF" font-size="12">Operaciones · Datos · Sistemas</text>
    </g>

    <g transform="translate(184 0)">
