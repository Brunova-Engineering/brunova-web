    <path d="M-126-134A184 184 0 0 1 135-125" fill="none" stroke="url(#ring)" stroke-opacity=".72" marker-end="url(#arrow)"/>
    <path d="M169-69A184 184 0 0 1 131 129" fill="none" stroke="url(#ring)" stroke-opacity=".72" marker-end="url(#arrow)"/>
    <path d="M59 174A184 184 0 0 1-159 91" fill="none" stroke="url(#ring)" stroke-opacity=".72" marker-end="url(#arrow)"/>

    <circle r="96" fill="#091012" stroke="#A69376" stroke-width="1.4"/>
    <circle r="87" fill="none" stroke="#D8C6A8" stroke-opacity=".12"/>
    <circle r="42" fill="#D7C4A4" opacity=".09" filter="url(#glow)"/>
    <circle cy="-34" r="15" fill="url(#orb)"/>
    <text y="7" fill="#F4F3EF" font-size="19" text-anchor="middle" font-weight="600"><tspan x="0">Inteligencia</tspan><tspan x="0" dy="23">operativa</tspan></text>

    <g fill="none" stroke="#D8C6A8" stroke-opacity=".68" marker-end="url(#arrow)"><path d="M0-98v-50"/><path d="M98 0h50"/><path d="M0 98v50"/></g>

