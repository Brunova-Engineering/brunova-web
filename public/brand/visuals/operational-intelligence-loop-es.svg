    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8C6A8"/><stop offset=".45" stop-color="#737A79"/><stop offset="1" stop-color="#D8C6A8"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1l8 4-8 4z" fill="#D7C5A7"/></marker>
  </defs>
  <g font-family="Manrope,Arial,sans-serif" transform="translate(480 240)">
