<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
  <title id="title">Ciclo de control de inteligencia operativa</title>
  <desc id="desc">Observar señales operativas, decidir con límites y gobernanza, y actuar mediante automatización, software e IA gobernados.</desc>
  <defs>
