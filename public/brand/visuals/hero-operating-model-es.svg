      .display { font-family:Manrope,sans-serif; } .body { font-family:"IBM Plex Sans",sans-serif; }
      .ink { fill:var(--visual-ink); } .muted { fill:var(--visual-muted); } .faint-fill { fill:var(--visual-faint); }
      .rule { stroke:var(--visual-rule); } .guide { stroke:var(--visual-faint); }
    </style>
