<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <!-- Hallmark · pre-emit critique: P5 H5 E5 S5 R5 V5 -->
  <title id="title">De una operación fragmentada a una operación confiable</title>
  <desc id="desc">Trabajo, datos y sistemas se integran dentro de un límite claro. Estado, decisiones y gobernanza forman un modelo operativo gobernado que produce resultados controlados, operables y escalables.</desc>
